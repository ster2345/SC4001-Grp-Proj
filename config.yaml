seed: 42
drive_root: /content/drive/MyDrive/sc4001_project
local_root: /content/data

train_generator: sd14
test_generators: [adm, biggan, midjourney]

samples:
  train_per_class: 1000
  val_per_class: 250
  test_per_class: 500   # per test generator

cleaning:
  jpeg_quality: 95
  size: 256
  resize: center_crop_then_bicubic

clip:
  model: openai/clip-vit-base-patch32
  batch_size: 128

sources:
  sd14:       {genimage_folder: "Stable Diffusion V1.4", part: train}
  adm:        {genimage_folder: "ADM", part: val}
  biggan:     {genimage_folder: "BigGAN", part: val}
  midjourney: {genimage_folder: "Midjourney", part: val}

# ---- Member B: model training (all settings for train_clip_probe.py / train_resnet.py) ----
train:
  seeds: [42, 43, 44]          # 3 seeds per ResNet run, to measure run-to-run variation
  results_dir: results         # under drive_root: predictions, checkpoints, experiment log

  clip_probe:
    C_grid: [0.01, 0.1, 1, 10, 100]   # inverse regularisation strengths tried; best chosen on val
    max_iter: 5000

  resnet:
    weights: IMAGENET1K_V2     # torchvision ImageNet-pretrained ResNet-50
    resize: 256                # shorter side resized to 256, then ...
    crop: 224                  # ... a 224x224 crop (random for train, centre for val/test)
    batch_size: 32
    lr: 0.0001                 # Adam learning rate
    max_epochs: 10
    patience: 3                # early stopping on validation loss
    num_workers: 2
