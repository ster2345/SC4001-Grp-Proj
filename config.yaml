seed: 42
drive_root: /content/drive/MyDrive/sc4001_project
local_root: /content/data

train_generator: sd14
test_generators: [adm, biggan, midjourney]

samples:
  train_per_class: 1000
  val_per_class: 250
  test_per_class: 500   # per test generator

cleaning:
  jpeg_quality: 95
  size: 256
  resize: center_crop_then_bicubic

clip:
  model: openai/clip-vit-base-patch32
  batch_size: 128

sources:
  sd14:       {genimage_folder: "Stable Diffusion V1.4", part: train}
  adm:        {genimage_folder: "ADM", part: val}
  biggan:     {genimage_folder: "BigGAN", part: val}
  midjourney: {genimage_folder: "Midjourney", part: val}